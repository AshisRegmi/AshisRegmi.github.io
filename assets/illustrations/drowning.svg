<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Drowning: get the person out of the water, then begin rescue breaths and CPR, and use an AED when available" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="400" height="300" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="399" height="299" rx="16" fill="none" stroke="#e6e1d8" stroke-width="1"/>

  <!-- ground -->
  <line x1="22" y1="268" x2="378" y2="268" stroke="#cfd4dc" stroke-width="2"/>

  <!-- victim lying, head left -->
  <circle cx="92" cy="238" r="18" fill="#fddcbd" stroke="#cfb096" stroke-width="2"/>
  <path d="M 76 232 a18 18 0 0 1 18 -13 l -8 4 a14 14 0 0 0 -10 9 z" fill="#44332c"/>
  <rect x="100" y="210" width="176" height="58" rx="26" fill="#24445e" stroke="#1c3550" stroke-width="2"/>
  <path d="M 212 254 L 296 260" stroke="#24445e" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- animated chest rise (rescue breaths) -->
  <g>
    <path d="M 140 208 Q 170 196 200 208" fill="none" stroke="#7fd4e3" stroke-width="5" stroke-linecap="round">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      values="0 0; 0 -6; 0 0" keyTimes="0; 0.4; 1" dur="2.4s" repeatCount="indefinite"/>
  </g>

  <!-- rescuer at the head: head-tilt / rescue breath -->
  <circle cx="150" cy="150" r="16" fill="#fddcbd" stroke="#cfb096" stroke-width="2"/>
  <path d="M 138 140 a16 16 0 0 1 26 0 z" fill="#3c2a22"/>
  <path d="M 133 150 q -6 1 -4 6 q 3 -1 4 -5 z" fill="#fddcbd" stroke="#cfb096" stroke-width="1.5"/>
  <circle cx="140" cy="147" r="1.6" fill="#3c2a22"/>
  <rect x="144" y="164" width="13" height="12" fill="#fddcbd" stroke="#cfb096" stroke-width="1.5"/>
  <!-- rescuer torso leaning over -->
  <path d="M 138 176 L 182 176 L 190 212 L 128 212 Z" fill="#0e7c7b" stroke="#0a5f5e" stroke-width="2"/>
  <!-- arm tilting the victim's chin -->
  <path d="M 168 206 L 118 224" stroke="#fddcbd" stroke-width="8" stroke-linecap="round" fill="none"/>

  <g font-size="15" fill="#333333">
    <text x="64" y="60" text-anchor="middle" font-weight="700" fill="#b00020">Call 911,</text>
    <text x="64" y="78" text-anchor="middle" fill="#b00020">get out of water</text>
    <text x="318" y="120" text-anchor="middle" font-weight="600" fill="#0e7c7b">Rescue breaths</text>
    <text x="318" y="138" text-anchor="middle" fill="#0e7c7b">then CPR</text>
    <text x="318" y="160" text-anchor="middle" fill="#5b6470">use an AED</text>
  </g>
</svg>