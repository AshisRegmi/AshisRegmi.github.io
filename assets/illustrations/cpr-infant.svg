<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="CPR infant: compress the lower half of the breastbone with two fingers, about one and a half inches deep, 100 to 120 per minute, 30 compressions to 2 breaths" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="400" height="300" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="399" height="299" rx="16" fill="none" stroke="#e6e1d8" stroke-width="1"/>

  <!-- ground -->
  <line x1="22" y1="270" x2="378" y2="270" stroke="#cfd4dc" stroke-width="2"/>

  <!-- ===== INFANT lying on back, head LEFT ===== -->
  <!-- legs (tiny) -->
  <rect x="252" y="244" width="84" height="24" rx="12" fill="#f3d1b2" stroke="#c78e63" stroke-width="1.5"/>
  <!-- torso (onesie) -->
  <rect x="100" y="210" width="164" height="58" rx="24" fill="#f3d1b2" stroke="#c78e63" stroke-width="1.5"/>
  <rect x="238" y="212" width="40" height="52" rx="16" fill="#ffffff" stroke="#cfd4dc" stroke-width="1.5"/>
  <!-- infant head (bigger, face up) -->
  <circle cx="82" cy="238" r="23" fill="#fddcbd" stroke="#cfb096" stroke-width="2"/>
  <path d="M 62 230 a23 23 0 0 1 26 -20 l -12 4 a19 19 0 0 0 -14 16 z" fill="#5b443a"/>
  <line x1="72" y1="230" x2="80" y2="230" stroke="#5b4a3a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 84 218 q 4 4 -1 8" fill="#fddcbd" stroke="#cfb096" stroke-width="1.5"/>

  <!-- sternum target (just below nipple line) -->
  <circle cx="182" cy="218" r="22" fill="none" stroke="#b00020" stroke-width="2.5" stroke-dasharray="6 5"/>

  <!-- ===== ANIMATED two-finger compression ===== -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 0; 0 9; 0 0" keyTimes="0; 0.2; 1" dur="0.7s" repeatCount="indefinite"/>
    <!-- two fingers -->
    <g fill="#fddcbd" stroke="#cfb096" stroke-width="1.5">
      <rect x="176" y="202" width="7" height="16" rx="3.5"/>
      <rect x="185" y="202" width="7" height="16" rx="3.5"/>
    </g>
    <!-- rescuer hand above -->
    <rect x="168" y="192" width="34" height="14" rx="7" fill="#fddcbd" stroke="#cfb096" stroke-width="1.5"/>
  </g>
  <!-- rescuer arm -->
  <line x1="186" y1="180" x2="184" y2="64" stroke="#24445e" stroke-width="10" stroke-linecap="round"/>

  <!-- depth arrow -->
  <path d="M 278 180 l 0 42" stroke="#b00020" stroke-width="3" fill="none"/>
  <path d="M 271 214 l 7 9 l 7 -9" fill="#b00020"/>
  <path d="M 271 188 l 7 -9 l 7 9" fill="#b00020"/>

  <g font-size="14" fill="#333333">
    <text x="298" y="194" text-anchor="start" fill="#b00020" font-weight="600">1.5 in</text>
    <text x="298" y="211" text-anchor="start" fill="#5b6470">(4 cm)</text>
    <text x="298" y="230" text-anchor="start" fill="#0e7c7b" font-weight="600">2 fingers</text>
    <text x="182" y="296" text-anchor="middle" font-size="13" fill="#5b6470">30 compressions : 2 breaths — 100–120 / min</text>
  </g>
</svg>