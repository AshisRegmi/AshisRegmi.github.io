<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Concussion: keep the person still, apply a cold pack, and monitor closely for twenty-four to forty-eight hours" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="400" height="300" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="399" height="299" rx="16" fill="none" stroke="#e6e1d8" stroke-width="1"/>

  <!-- ground -->
  <line x1="22" y1="262" x2="378" y2="262" stroke="#cfd4dc" stroke-width="2"/>

  <!-- person lying, head left, resting -->
  <circle cx="108" cy="226" r="20" fill="#fddcbd" stroke="#cfb096" stroke-width="2"/>
  <path d="M 90 218 a20 20 0 0 1 22 -16 l -10 4 a16 16 0 0 0 -12 12 z" fill="#44332c"/>
  <line x1="100" y1="220" x2="108" y2="220" stroke="#5b4a3a" stroke-width="2" stroke-linecap="round"/>
  <rect x="112" y="214" width="176" height="50" rx="22" fill="#24445e" stroke="#1c3550" stroke-width="2"/>
  <path d="M 226 246 L 316 252" stroke="#24445e" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- cold pack on the head -->
  <rect x="116" y="186" width="40" height="14" rx="6" fill="#7fd4e3" stroke="#4ea1ff" stroke-width="2">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <path d="M 126 186 L 126 176 M 136 186 L 136 174 M 146 186 L 146 176" stroke="#4ea1ff" stroke-width="2" stroke-linecap="round">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
  </path>

  <!-- monitor clock -->
  <circle cx="312" cy="120" r="26" fill="#ffffff" stroke="#26303c" stroke-width="2.5"/>
  <path d="M 312 120 L 312 108 M 312 120 L 324 124" stroke="#b00020" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="312" cy="120" r="4" fill="#b00020">
    <animate attributeName="r" values="3;6;3" dur="1.6s" repeatCount="indefinite"/>
  </circle>

  <g font-size="15" fill="#333333">
    <text x="312" y="168" text-anchor="middle" font-weight="600" fill="#b00020">watch 24–48 h</text>
    <text x="312" y="186" text-anchor="middle" fill="#5b6470">for drowsiness,</text>
    <text x="312" y="204" text-anchor="middle" fill="#5b6470">confusion</text>
    <text x="80" y="84" text-anchor="middle" font-weight="600" fill="#0e7c7b">Rest, keep still,</text>
    <text x="80" y="102" text-anchor="middle" fill="#0e7c7b">avoid screens</text>
  </g>
</svg>