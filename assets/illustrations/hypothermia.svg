<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Hypothermia: move to a warm dry place, remove wet clothing, and warm the center of the body first with blankets and a warm drink" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="400" height="300" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="399" height="299" rx="16" fill="none" stroke="#e6e1d8" stroke-width="1"/>

  <!-- person wrapped in a warm blanket -->
  <circle cx="150" cy="72" r="17" fill="#fddcbd" stroke="#cfb096" stroke-width="2"/>
  <path d="M 136 62 a17 17 0 0 1 30 0 z" fill="#44332c"/>
  <circle cx="144" cy="70" r="1.8" fill="#333333"/><circle cx="158" cy="70" r="1.8" fill="#333333"/>
  <path d="M 150 76 q -4 4 0 5" stroke="#333333" stroke-width="1.5" fill="none"/>
  <rect x="144" y="88" width="12" height="9" fill="#fddcbd" stroke="#cfb096" stroke-width="1.5"/>

  <!-- amber blanket -->
  <path d="M 112 102 Q 150 92 188 102 L 194 186 Q 150 198 106 186 Z" fill="#e8a24a" stroke="#c97f2e" stroke-width="2.5"/>
  <path d="M 116 112 Q 150 104 184 112 L 184 118 Q 150 111 116 119 Z" fill="#f5bd72" stroke="#c97f2e" stroke-width="1.5"/>

  <!-- arms + hands holding a warm mug -->
  <path d="M 128 128 L 156 158" stroke="#fddcbd" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 172 128 L 148 158" stroke="#fddcbd" stroke-width="8" stroke-linecap="round" fill="none"/>
  <g fill="#fddcbd" stroke="#cfb096" stroke-width="1.5">
    <circle cx="152" cy="164" r="7"/>
    <circle cx="142" cy="166" r="7"/>
  </g>

  <!-- mug (held in front) -->
  <g>
    <rect x="132" y="164" width="30" height="30" rx="6" fill="#f4b400" stroke="#c99400" stroke-width="2"/>
    <path d="M 162 172 a 7 7 0 0 1 0 14" fill="none" stroke="#c99400" stroke-width="3"/>
  </g>
  <!-- steam rising from the mug (animated) -->
  <g fill="none" stroke="#8a93a6" stroke-width="2.5" stroke-linecap="round">
    <path d="M 140 158 q -5 -10 0 -22"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.8s" repeatCount="indefinite"/></path>
    <path d="M 148 158 q 5 -10 0 -22"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></path>
    <path d="M 156 158 q -4 -9 0 -20"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></path>
  </g>

  <g font-size="15" fill="#333333">
    <text x="66" y="58" text-anchor="middle" font-weight="700" fill="#0e7c7b">Move to warm,</text>
    <text x="66" y="76" text-anchor="middle" fill="#0e7c7b">dry place</text>
    <text x="66" y="96" text-anchor="middle" fill="#0e7c7b">remove wet clothes</text>
    <text x="310" y="120" text-anchor="middle" font-weight="600" fill="#b00020">Warm the core:</text>
    <text x="310" y="138" text-anchor="middle" fill="#5b6470">chest, neck, groin</text>
    <text x="210" y="238" text-anchor="middle" font-weight="600" fill="#b00020">warm drink</text>
    <text x="210" y="256" text-anchor="middle" fill="#5b6470">handle gently</text>
  </g>
</svg>