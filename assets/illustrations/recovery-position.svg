<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Recovery position: roll the person onto their side, head tilted back, top leg bent to keep the airway open" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="400" height="300" rx="16" fill="#fbfaf7"/>
  <rect x="0.5" y="0.5" width="399" height="299" rx="16" fill="none" stroke="#e6e1d8" stroke-width="1"/>

  <!-- ground -->
  <line x1="20" y1="262" x2="380" y2="262" stroke="#cfd4dc" stroke-width="2"/>

  <!-- ===== PERSON lying on their SIDE, head at LEFT ===== -->
  <!-- bottom arm extended under/forward -->
  <path d="M 150 226 L 96 250" stroke="#f1c4a0" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- head resting on/above the extended arm, tilted back (airway) -->
  <circle cx="112" cy="196" r="21" fill="#f1c4a0" stroke="#c78e63" stroke-width="2"/>
  <path d="M 94 188 a21 21 0 0 1 30 -18 l -12 5 a17 17 0 0 0 -18 13 z" fill="#44332c"/>
  <!-- face: eye + nose, facing up/left (airway open) -->
  <line x1="104" y1="192" x2="110" y2="192" stroke="#5b4a3a" stroke-width="2" stroke-linecap="round"/>
  <path d="M 96 200 q 4 4 2 8" fill="#f1c4a0" stroke="#c78e63" stroke-width="1.5"/>
  <!-- top arm bent, hand near chin -->
  <g stroke="#f1c4a0" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M 168 214 L 148 196 L 122 202"/>
  </g>
  <circle cx="122" cy="202" r="6" fill="#f1c4a0" stroke="#c78e63" stroke-width="2"/>
  <!-- torso (on side) -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 0; 0 3; 0 0" dur="2.4s" repeatCount="indefinite"/>
    <rect x="120" y="208" width="180" height="54" rx="24" fill="#24445e" stroke="#1c3550" stroke-width="2"/>
  </g>
  <!-- hips -->
  <circle cx="290" cy="236" r="24" fill="#24445e" stroke="#1c3550" stroke-width="2"/>
  <!-- bottom leg straight -->
  <path d="M 282 244 L 336 256" stroke="#24445e" stroke-width="20" stroke-linecap="round" fill="none"/>
  <ellipse cx="340" cy="258" rx="11" ry="7" fill="#f1c4a0" stroke="#c78e63" stroke-width="2"/>
  <!-- top leg bent (knee forward) -->
  <g stroke="#0e7c7b" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 272 234 L 300 208 L 338 216"/>
  </g>
  <ellipse cx="342" cy="218" rx="11" ry="7" fill="#f1c4a0" stroke="#c78e63" stroke-width="2"/>

  <!-- airway arrow -->
  <path d="M 84 160 C 78 172 78 182 84 190" stroke="#b00020" stroke-width="2.5" fill="none"/>
  <path d="M 78 170 l 8 3 l -3 9" fill="#b00020"/>

  <g font-size="14" fill="#26303c">
    <text x="56" y="120" text-anchor="middle" font-weight="600" fill="#b00020">Head tilted back,</text>
    <text x="56" y="138" text-anchor="middle" fill="#b00020">airway open</text>
    <text x="322" y="118" text-anchor="middle" fill="#0e7c7b">Top leg bent</text>
    <text x="322" y="136" text-anchor="middle" fill="#0e7c7b">keeps them stable</text>
  </g>
</svg>