<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Frostbite: warm slowly in lukewarm not hot water until skin is red and sensation returns, do not rub the area" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="400" height="300" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="399" height="299" rx="16" fill="none" stroke="#e6e1d8" stroke-width="1"/>

  <!-- bowl -->
  <path d="M 90 172 a 110 44 0 0 0 220 0 z" fill="#eef2f6" stroke="#8a93a6" stroke-width="2.5"/>
  <path d="M 120 120 a 80 30 0 0 0 160 0" fill="none" stroke="#4ea1ff" stroke-width="3" opacity="0.6"/>
  <path d="M 132 132 a 68 26 0 0 0 136 0" fill="none" stroke="#4ea1ff" stroke-width="3" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.75;0.4" dur="1.4s" repeatCount="indefinite"/>
  </path>
  <!-- steam (warmth, animated rising) -->
  <g fill="none" stroke="#c9a6b8" stroke-width="3" stroke-linecap="round">
    <path d="M 150 150 q 6 -10 0 -20"><animate attributeName="opacity" values="0;0.6;0" dur="1.6s" repeatCount="indefinite"/></path>
    <path d="M 250 150 q 6 -10 0 -20"><animate attributeName="opacity" values="0;0.6;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></path>
  </g>

  <!-- forearm + hand soaking -->
  <g stroke="#cfb096" stroke-width="2" fill="#fddcbd">
    <rect x="140" y="128" width="48" height="96" rx="20" transform="rotate(22 164 176)"/>
  </g>
  <!-- fingertips (white/pale = frostnip) -->
  <g fill="#fbe9e3" stroke="#cfb096" stroke-width="2">
    <rect x="202" y="150" width="13" height="30" rx="6" transform="rotate(8 208 165)"/>
    <rect x="218" y="154" width="13" height="30" rx="6" transform="rotate(16 224 169)"/>
    <rect x="234" y="160" width="13" height="28" rx="6" transform="rotate(24 240 174)"/>
  </g>
  <!-- water level line animating (gentle ripple) -->
  <line x1="96" y1="182" x2="304" y2="182" stroke="#4ea1ff" stroke-width="3" opacity="0.7">
    <animate attributeName="y1" values="182;180;182" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="182;184;182" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <g font-size="15" fill="#333333">
    <text x="200" y="26" text-anchor="middle" font-weight="700" fill="#0e7c7b">Warm slowly in lukewarm water</text>
    <text x="200" y="252" text-anchor="middle" font-weight="600" fill="#b00020">Do not rub</text>
    <text x="200" y="272" text-anchor="middle" fill="#5b6470">until red and sensation returns</text>
  </g>
</svg>