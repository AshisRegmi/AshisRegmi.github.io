<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Burns: cool the burn under cool running water for ten to twenty minutes, do not apply ice or butter" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="400" height="300" rx="16" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="399" height="299" rx="16" fill="none" stroke="#e6e1d8" stroke-width="1"/>

  <!-- faucet -->
  <g stroke="#8a93a6" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 150 34 L 150 60 L 210 60 L 210 82"/>
  </g>
  <rect x="206" y="80" width="10" height="10" rx="3" fill="#8a93a6"/>

  <!-- falling water drops (animated) -->
  <g fill="#4ea1ff">
    <circle cx="178" cy="120" r="4"><animate attributeName="cy" values="86;176" dur="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="198" cy="120" r="3.5"><animate attributeName="cy" values="92;182" dur="0.7s" begin="0.23s" repeatCount="indefinite"/></circle>
    <circle cx="188" cy="120" r="4.5"><animate attributeName="cy" values="88;178" dur="0.7s" begin="0.46s" repeatCount="indefinite"/></circle>
  </g>
  <!-- water stream glow -->
  <line x1="194" y1="86" x2="194" y2="176" stroke="#cfe4ff" stroke-width="16" opacity="0.5"/>

  <!-- forearm with burn, under the stream -->
  <g stroke="#cfb096" stroke-width="2">
    <rect x="128" y="176" width="150" height="44" rx="20" fill="#fddcbd"/>
  </g>
  <!-- burn patch -->
  <ellipse cx="196" cy="198" rx="34" ry="14" fill="#e9967a"/>
  <ellipse cx="196" cy="198" rx="22" ry="7" fill="#d9674f"/>
  <circle cx="180" cy="194" r="3" fill="#f4c2c2"/>
  <circle cx="212" cy="202" r="3" fill="#f4c2c2"/>
  <!-- hand -->
  <g fill="#fddcbd" stroke="#cfb096" stroke-width="2">
    <rect x="270" y="182" width="26" height="30" rx="11" transform="rotate(6 283 197)"/>
  </g>

  <g font-size="15" fill="#333333">
    <text x="200" y="26" text-anchor="middle" font-weight="700" fill="#0e7c7b">Cool under running water</text>
    <text x="88" y="236" text-anchor="middle" font-weight="600" fill="#b00020">10–20 min</text>
    <text x="88" y="254" text-anchor="middle" fill="#5b6470">no ice</text>
    <text x="312" y="236" text-anchor="middle" fill="#5b6470">no butter</text>
    <text x="312" y="254" text-anchor="middle" fill="#5b6470">don't burst</text>
    <text x="312" y="272" text-anchor="middle" fill="#5b6470">blisters</text>
  </g>
</svg>