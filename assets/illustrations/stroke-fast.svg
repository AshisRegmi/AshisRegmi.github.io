<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Stroke F.A.S.T.: Face drooping, Arm weakness, Speech difficulty, Time to call 911" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="400" height="300" rx="16" fill="#fbfaf7"/>
  <rect x="0.5" y="0.5" width="399" height="299" rx="16" fill="none" stroke="#e6e1d8" stroke-width="1"/>

  <!-- F — Face drooping -->
  <g>
    <rect x="16" y="14" width="180" height="132" rx="12" fill="#fff" stroke="#e6e1d8"/>
    <text x="28" y="36" font-size="15" font-weight="700"><tspan fill="#b00020" font-weight="800">F</tspan><tspan fill="#26303c">ace drooping</tspan></text>
    <!-- front face -->
    <circle cx="106" cy="90" r="26" fill="#f1c4a0" stroke="#c78e63" stroke-width="2"/>
    <circle cx="96" cy="86" r="2.5" fill="#3c2a22"/>
    <circle cx="116" cy="86" r="2.5" fill="#3c2a22"/>
    <path d="M 104 90 L 104 96" stroke="#c78e63" stroke-width="1.5"/>
    <!-- asymmetric mouth: right side droops -->
    <path d="M 92 102 Q 106 108 118 96" stroke="#26303c" stroke-width="2" fill="none"/>
  </g>

  <!-- A — Arm weakness -->
  <g>
    <rect x="204" y="14" width="180" height="132" rx="12" fill="#fff" stroke="#e6e1d8"/>
    <text x="216" y="36" font-size="15" font-weight="700"><tspan fill="#b00020" font-weight="800">A</tspan><tspan fill="#26303c">rm weakness</tspan></text>
    <!-- normal raised arm -->
    <path d="M 250 118 L 274 76" stroke="#f1c4a0" stroke-width="10" stroke-linecap="round"/>
    <circle cx="274" cy="72" r="8" fill="#f1c4a0" stroke="#c78e63" stroke-width="2"/>
    <!-- weak arm drooping -->
    <path d="M 306 118 L 328 100" stroke="#f1c4a0" stroke-width="10" stroke-linecap="round"/>
    <circle cx="330" cy="98" r="8" fill="#f1c4a0" stroke="#c78e63" stroke-width="2"/>
    <path d="M 322 114 l 5 9" stroke="#b00020" stroke-width="2.5"/>
  </g>

  <!-- S — Speech difficulty -->
  <g>
    <rect x="16" y="154" width="180" height="132" rx="12" fill="#fff" stroke="#e6e1d8"/>
    <text x="28" y="176" font-size="15" font-weight="700"><tspan fill="#b00020" font-weight="800">S</tspan><tspan fill="#26303c">peech difficulty</tspan></text>
    <rect x="66" y="196" width="96" height="40" rx="14" fill="#eef2f6" stroke="#d5dce5"/>
    <text x="114" y="220" text-anchor="middle" font-size="13" fill="#7b8494">"slurred…"</text>
  </g>

  <!-- T — Time -->
  <g>
    <rect x="204" y="154" width="180" height="132" rx="12" fill="#fff" stroke="#e6e1d8"/>
    <text x="216" y="176" font-size="15" font-weight="700"><tspan fill="#b00020" font-weight="800">T</tspan><tspan fill="#26303c">ime to call 911</tspan></text>
    <circle cx="286" cy="224" r="22" fill="#fff" stroke="#26303c" stroke-width="2.5"/>
    <path d="M 286 224 L 286 212 M 286 224 L 298 228" stroke="#b00020" stroke-width="2.5" stroke-linecap="round"/>
    <text x="286" y="270" text-anchor="middle" font-size="15" font-weight="700" fill="#b00020">911</text>
      </g>

      <!-- F.A.S.T. scan highlight (animated) -->
      <rect x="16" y="14" width="180" height="132" rx="12" fill="none" stroke="#b00020" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="2s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="204" y="14" width="180" height="132" rx="12" fill="none" stroke="#b00020" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="16" y="154" width="180" height="132" rx="12" fill="none" stroke="#b00020" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="2s" begin="1s" repeatCount="indefinite"/>
      </rect>
      <rect x="204" y="154" width="180" height="132" rx="12" fill="none" stroke="#b00020" stroke-width="3" opacity="0">
        <animate attributeName="opacity" values="0;0.9;0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
    </svg>