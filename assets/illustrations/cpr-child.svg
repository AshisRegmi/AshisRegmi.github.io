<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="CPR child: one or two hands on the lower half of the breastbone, about 2 inches deep" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <rect width="400" height="300" rx="16" fill="#fbfaf7"/>
  <rect x="0.5" y="0.5" width="399" height="299" rx="16" fill="none" stroke="#e6e1d8" stroke-width="1"/>

  <!-- ground -->
  <line x1="22" y1="272" x2="378" y2="272" stroke="#cfd4dc" stroke-width="2"/>

  <!-- ===== CHILD lying on back, head LEFT (smaller body, bigger head) ===== -->
  <!-- legs -->
  <rect x="254" y="242" width="88" height="30" rx="14" fill="#0e7c7b" stroke="#0a5f5e" stroke-width="2"/>
  <ellipse cx="346" cy="256" rx="9" ry="7" fill="#f1c4a0" stroke="#c78e63" stroke-width="2"/>
  <!-- torso -->
  <rect x="96" y="204" width="168" height="66" rx="28" fill="#0e7c7b" stroke="#0a5f5e" stroke-width="2"/>
  <!-- child's arm at side -->
  <path d="M 118 242 L 218 250" stroke="#f1c4a0" stroke-width="11" stroke-linecap="round" fill="none"/>
  <!-- child head (bigger relative to body), face up -->
  <circle cx="78" cy="238" r="22" fill="#f1c4a0" stroke="#c78e63" stroke-width="2"/>
  <path d="M 58 230 a22 22 0 0 1 24 -18 l -10 4 a18 18 0 0 0 -14 14 z" fill="#44332c"/>
  <path d="M 82 220 q 4 5 -1 9" fill="#f1c4a0" stroke="#c78e63" stroke-width="1.5"/>
  <line x1="66" y1="232" x2="74" y2="232" stroke="#5b4a3a" stroke-width="2" stroke-linecap="round"/>

  <!-- sternum target -->
  <circle cx="182" cy="212" r="24" fill="none" stroke="#b00020" stroke-width="2.5" stroke-dasharray="6 5"/>

  <!-- rescuer's ONE hand (child may use one or two) -->
  <g fill="#f1c4a0" stroke="#c78e63" stroke-width="2">
      <animateTransform attributeName="transform" attributeType="XML" type="translate" values="0 0; 0 8; 0 0" keyTimes="0; 0.2; 1" dur="0.7s" repeatCount="indefinite"/>
      <rect x="162" y="198" width="40" height="16" rx="8" transform="rotate(-6 182 206)"/>
    </g>
  <!-- rescuer arm straight above -->
  <line x1="184" y1="176" x2="182" y2="70" stroke="#24445e" stroke-width="10" stroke-linecap="round"/>

  <!-- depth arrow -->
  <path d="M 288 178 l 0 42" stroke="#b00020" stroke-width="3" fill="none"/>
  <path d="M 281 212 l 7 9 l 7 -9" fill="#b00020"/>
  <path d="M 281 186 l 7 -9 l 7 9" fill="#b00020"/>

  <g font-size="14" fill="#26303c">
    <text x="306" y="194" text-anchor="start" fill="#b00020" font-weight="600">2 in</text>
    <text x="306" y="211" text-anchor="start" fill="#5b6470">(5 cm)</text>
    <text x="306" y="228" text-anchor="start" fill="#0e7c7b" font-weight="600">1–2 hands</text>
    <text x="180" y="296" text-anchor="middle" font-size="13" fill="#5b6470">Lower half of the breastbone</text>
  </g>
</svg>